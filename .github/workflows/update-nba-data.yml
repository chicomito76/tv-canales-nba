name: Actualizar TV Canales NBA

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-canales-nba-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar calendario y transmisiones
        run: python scripts/update_live_data.py

      - name: Guardar cambios si existen
        run: |
          if git diff --quiet -- public/data docs/data; then
            echo "Sin cambios de datos"
            exit 0
          fi
          git config user.name "TV Canales NBA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data docs/data
          git commit -m "Actualizar datos NBA automáticamente"
          git push
